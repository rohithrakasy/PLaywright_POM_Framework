name: Playwright Automation Tests

on:
    push: 
        branches: 
            - develop
            - main

    pull_request: 
        branches: 
            - main
    workflow_dispatch:

        inputs:
            environment:

                description: 'Select Environment'
                required: true
                default: 'dev'
                type: choice
                options:
                    - DeV
                    - Main
        
        browser:
            description: "Select Browser"
            required : true
            default: 'chromium'
            type: choice
            options:
                - chromium
                - firefox
                - webkit

        

jobs:
    playwright-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version : 20

            - name: Install dependencies
              run: npm ci

            - name: Run Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright Test
              run: npx playwright test hyrPrac.spec.js      

            - name: Upload Playwright HTML Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: playwright-report
                path: playwright-report/
                retention-days: 7

            - name: Upload Allure Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: allure-results
                path: allure-results/
                retention-days: 7






